# GDE DEVOPS - GitHub Actions CI
name: GDE DevOps CI

# Automatizalas inditasa
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vegrehajtando feladatok
jobs:
  build:
    name: Node.js es Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Forraskod letoltese
        uses: actions/checkout@v4

      - name: Node.js 24 beallitasa
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Fuggosegek telepitese
        run: npm ci
        
      - name: Automatizalt HTTP tesztek
        run: npm test

      - name: Docker image epitese
        run: docker build -t gde-devops-hola-mundo:ci .
